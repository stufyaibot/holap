<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holap 🌴 — Holiday Planner</title>
  <meta name="description" content="Plan your perfect holiday. Find the cheapest hotels, activities, and transport." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',900:'#0c4a6e' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    .card-hover { transition: all 0.2s ease; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

<!-- Header -->
<header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🌴</span>
      <span class="text-xl font-bold text-primary-600">Holap</span>
    </div>
    <nav class="text-sm text-gray-500 gap-6 hidden md:flex">
      <a href="#results" class="hover:text-primary-600">Results</a>
      <a href="#trip-total" class="hover:text-primary-600">My Trip</a>
    </nav>
  </div>
</header>

<!-- Hero -->
<section class="bg-gradient-to-br from-primary-600 to-primary-900 text-white py-16 px-4">
  <div class="max-w-2xl mx-auto text-center">
    <h1 class="text-4xl font-bold mb-3">Find the cheapest holiday</h1>
    <p class="text-primary-200 mb-8 text-lg">Hotels · Activities · Transport — auto-sorted by price</p>
    <div class="bg-white rounded-2xl p-3 flex gap-2 shadow-xl">
      <input id="search" type="text" placeholder="Where to? (e.g. Bali, Bangkok, Paris)" 
        class="flex-1 px-4 py-3 rounded-xl border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500" />
      <select id="nights" class="px-4 py-3 rounded-xl border border-gray-200 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white">
        <option value="3">3 nights</option>
        <option value="5">5 nights</option>
        <option value="7" selected>7 nights</option>
        <option value="10">10 nights</option>
        <option value="14">14 nights</option>
      </select>
      <button onclick="search()" class="bg-primary-600 hover:bg-primary-700 text-white px-6 py-3 rounded-xl font-semibold transition flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.35-4.35"/></svg>
        Search
      </button>
    </div>
  </div>
</section>

<!-- Quick picks -->
<section class="max-w-6xl mx-auto px-4 py-8">
  <p class="text-sm text-gray-400 mb-3 uppercase tracking-wider">Quick picks</p>
  <div class="flex gap-2 flex-wrap">
    <button onclick="quickSearch('Bali')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm hover:border-primary-400 hover:text-primary-600 transition">🏝️ Bali</button>
    <button onclick="quickSearch('Bangkok')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm hover:border-primary-400 hover:text-primary-600 transition">🛕 Bangkok</button>
    <button onclick="quickSearch('Paris')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm hover:border-primary-400 hover:text-primary-600 transition">🗼 Paris</button>
    <button onclick="quickSearch('Tokyo')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm hover:border-primary-400 hover:text-primary-600 transition">⛩️ Tokyo</button>
    <button onclick="quickSearch('Istanbul')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm hover:border-primary-400 hover:text-primary-600 transition">🕌 Istanbul</button>
    <button onclick="quickSearch('Barcelona')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm hover:border-primary-400 hover:text-primary-600 transition">🎨 Barcelona</button>
  </div>
</section>

<!-- Results -->
<div id="results" class="max-w-6xl mx-auto px-4 py-8 hidden">
  <div id="results-content"></div>
</div>

<!-- Trip Summary -->
<div id="trip-total" class="max-w-6xl mx-auto px-4 pb-16 hidden">
  <div class="bg-primary-900 text-white rounded-2xl p-6 sticky bottom-4 shadow-2xl flex items-center justify-between flex-wrap gap-4">
    <div>
      <p class="text-primary-300 text-sm">Cheapest combo for <span id="trip-dest" class="font-semibold"></span></p>
      <p class="text-sm text-primary-300 mt-1"><span id="trip-nights"></span> nights · Transport + Hotel + Activities</p>
    </div>
    <div class="text-right">
      <p class="text-3xl font-bold" id="trip-total-price">$0</p>
      <p class="text-xs text-primary-300">per person</p>
    </div>
  </div>
</div>

<script>
// --- DATA ---
const DB = {
  hotels: [
    { id:'h1', name:'Sunset Beach Hotel', city:'Bali', country:'Indonesia', rating:4.5, price:85, amenities:['wifi','pool','breakfast'], emoji:'🏨' },
    { id:'h2', name:'Ubud Jungle Lodge', city:'Bali', country:'Indonesia', rating:4.3, price:65, amenities:['wifi','pool'], emoji:'🌿' },
    { id:'h3', name:'Backpacker Paradise', city:'Bali', country:'Indonesia', rating:4.0, price:22, amenities:['wifi'], emoji:'🎒' },
    { id:'h4', name:'Thonglor Budget Stay', city:'Bangkok', country:'Thailand', rating:4.1, price:30, amenities:['wifi','ac'], emoji:'🏙️' },
    { id:'h5', name:'Khao San Hostel', city:'Bangkok', country:'Thailand', rating:3.8, price:12, amenities:['wifi'], emoji:'🛏️' },
    { id:'h6', name:'Le Marais Boutique', city:'Paris', country:'France', rating:4.6, price:180, amenities:['wifi','breakfast'], emoji:'🇫🇷' },
    { id:'h7', name:'Ibis Budget Paris', city:'Paris', country:'France', rating:3.9, price:55, amenities:['wifi'], emoji:'🏨' },
    { id:'h8', name:'Shinjuku Station Hotel', city:'Tokyo', country:'Japan', rating:4.4, price:95, amenities:['wifi','breakfast'], emoji:'🗼' },
    { id:'h9', name:'Capsule Inn Akihabara', city:'Tokyo', country:'Japan', rating:3.7, price:35, amenities:['wifi'], emoji:'🔵' },
    { id:'h10', name:'Taksim View Hotel', city:'Istanbul', country:'Turkey', rating:4.3, price:60, amenities:['wifi','breakfast'], emoji:'🕌' },
    { id:'h11', name:'Eyup Budget Hotel', city:'Istanbul', country:'Turkey', rating:3.8, price:28, amenities:['wifi'], emoji:'🏠' },
    { id:'h12', name:'Gothic Quarter Hostel', city:'Barcelona', country:'Spain', rating:4.2, price:38, amenities:['wifi','ac'], emoji:'⛪' },
    { id:'h13', name:'Eixample Deluxe', city:'Barcelona', country:'Spain', rating:4.5, price:110, amenities:['wifi','pool','breakfast'], emoji:'✨' },
  ],
  activities: [
    { id:'a1', name:'Temple Tour', city:'Bali', category:'culture', price:25, duration:'4h', rating:4.6, emoji:'🛕' },
    { id:'a2', name:'Surf Lesson', city:'Bali', category:'adventure', price:30, duration:'2h', rating:4.8, emoji:'🏄' },
    { id:'a3', name:'Rice Terrace Trek', city:'Bali', category:'nature', price:15, duration:'3h', rating:4.7, emoji:'🌾' },
    { id:'a4', name:'Street Food Tour', city:'Bangkok', category:'food', price:18, duration:'3h', rating:4.7, emoji:'🍜' },
    { id:'a5', name:'Temple & Canal Tour', city:'Bangkok', category:'culture', price:22, duration:'5h', rating:4.5, emoji:'🛶' },
    { id:'a6', name:'Muay Thai Class', city:'Bangkok', category:'adventure', price:20, duration:'1.5h', rating:4.6, emoji:'🥊' },
    { id:'a7', name:'Louvre Skip-the-Line', city:'Paris', category:'culture', price:22, duration:'3h', rating:4.9, emoji:'🎨' },
    { id:'a8', name:'Seine River Cruise', city:'Paris', category:'sightseeing', price:15, duration:'1.5h', rating:4.6, emoji:'🚢' },
    { id:'a9', name:'Montmartre Walking Tour', city:'Paris', category:'culture', price:0, duration:'2h', rating:4.5, emoji:'🎭' },
    { id:'a10', name:'Shinto Shrine Tour', city:'Tokyo', category:'culture', price:0, duration:'3h', rating:4.7, emoji:'⛩️' },
    { id:'a11', name:'Tsukiji Food Walk', city:'Tokyo', category:'food', price:45, duration:'3h', rating:4.8, emoji:'🍣' },
    { id:'a12', name:'Basilica & Grand Bazaar', city:'Istanbul', category:'culture', price:0, duration:'4h', rating:4.6, emoji:'🕌' },
    { id:'a13', name:'Bosphorus Cruise', city:'Istanbul', category:'sightseeing', price:12, duration:'2h', rating:4.5, emoji:'🚤' },
    { id:'a14', name:'Sagrada Familia Entry', city:'Barcelona', category:'culture', price:26, duration:'1.5h', rating:4.9, emoji:'⛪' },
    { id:'a15', name:'Gothic Quarter Tour', city:'Barcelona', category:'culture', price:0, duration:'2h', rating:4.4, emoji:'🏛️' },
    { id:'a16', name:'La Boqueria Food Tour', city:'Barcelona', category:'food', price:35, duration:'3h', rating:4.7, emoji:'🍊' },
  ],
  transport: [
    { id:'t1', type:'flight', from:'Sydney', to:'Bali', price:650, duration:'6h', airline:'Qantas', emoji:'✈️' },
    { id:'t2', type:'flight', from:'Singapore', to:'Bali', price:180, duration:'2h', airline:'Scoot', emoji:'✈️' },
    { id:'t3', type:'flight', from:'Melbourne', to:'Bangkok', price:420, duration:'5h', airline:'Jetstar', emoji:'✈️' },
    { id:'t4', type:'flight', from:'London', to:'Paris', price:45, duration:'1.5h', airline:'EasyJet', emoji:'✈️' },
    { id:'t5', type:'train', from:'Paris', to:'Lyon', price:45, duration:'2h', airline:'SNCF', emoji:'🚄' },
    { id:'t6', type:'bus', from:'Bangkok', to:'Chiang Mai', price:25, duration:'10h', airline:'GreenBus', emoji:'🚌' },
    { id:'t7', type:'flight', from:'Tokyo', to:'Osaka', price:95, duration:'1.5h', airline:'JAL', emoji:'✈️' },
    { id:'t8', type:'flight', from:'Istanbul', to:'Cappadocia', price:60, duration:'1h', airline:'Pegasus', emoji:'✈️' },
    { id:'t9', type:'train', from:'Barcelona', to:'Madrid', price:35, duration:'2.5h', airline:'Renfe', emoji:'🚄' },
    { id:'t10', type:'flight', from:'Amsterdam', to:'Istanbul', price:120, duration:'3.5h', airline:'Transavia', emoji:'✈️' },
  ]
};

// --- STATE ---
let currentDestination = '';
let currentNights = 7;
let selectedItems = { transport: null, hotel: null, activities: [] };

function quickSearch(city) {
  document.getElementById('search').value = city;
  search();
}

function search() {
  const city = document.getElementById('search').value.trim();
  if (!city) return;
  currentDestination = city;
  currentNights = parseInt(document.getElementById('nights').value);
  
  // Find matches (case-insensitive)
  const c = city.toLowerCase();
  const hotels = DB.hotels.filter(h => h.city.toLowerCase() === c || h.country.toLowerCase() === c).sort((a,b) => a.price - b.price);
  const activities = DB.activities.filter(a => a.city.toLowerCase() === c || a.country.toLowerCase() === c).sort((a,b) => a.price - b.price);
  const transport = DB.transport.filter(t => t.to.toLowerCase() === c).sort((a,b) => a.price - b.price);
  
  const hotelCost = hotels[0] ? hotels[0].price * currentNights : 0;
  const activityCost = activities.reduce((s, a) => s + a.price, 0);
  const transportCost = transport[0]?.price ?? 0;
  const total = hotelCost + activityCost + transportCost;
  
  renderResults(hotels, activities, transport, total, transportCost, hotelCost, activityCost);
}

function renderResults(hotels, activities, transport, total, transportCost, hotelCost, activityCost) {
  const resultsEl = document.getElementById('results');
  const contentEl = document.getElementById('results-content');
  resultsEl.classList.remove('hidden');
  
  // Trip summary
  const tripEl = document.getElementById('trip-total');
  tripEl.classList.remove('hidden');
  document.getElementById('trip-dest').textContent = currentDestination;
  document.getElementById('trip-nights').textContent = currentNights;
  document.getElementById('trip-total-price').textContent = '$' + total.toLocaleString();
  
  let html = `
    <div class="mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl">
      <p class="font-semibold text-emerald-800">💰 Cheapest combo: $${total.toLocaleString()}</p>
      <p class="text-sm text-emerald-600 mt-1">Flight $${transportCost} · Hotel (${currentNights} nights) $${hotelCost} · Activities $${activityCost}</p>
    </div>
    
    <div class="grid lg:grid-cols-3 gap-6">
  `;
  
  // Transport
  html += `<div><h3 class="font-semibold text-gray-700 mb-3 flex items-center gap-2">✈️ Transport to ${currentDestination}</h3>`;
  if (transport.length === 0) {
    html += `<p class="text-gray-400 text-sm py-4">No transport data for this route. Try searching from another city.</p>`;
  } else {
    transport.forEach(t => {
      html += `
        <div class="bg-white rounded-xl border border-gray-200 p-4 mb-3 card-hover ${selectedItems.transport?.id === t.id ? 'border-primary-400 ring-2 ring-primary-200' : ''}">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-medium">${t.airline}</p>
              <p class="text-sm text-gray-500">${t.type.toUpperCase()} · ${t.duration}</p>
            </div>
            <span class="text-lg font-bold text-primary-600">$${t.price}</span>
          </div>
        </div>`;
    });
  }
  html += `</div>`;
  
  // Hotels
  html += `<div><h3 class="font-semibold text-gray-700 mb-3 flex items-center gap-2">🏨 Hotels</h3>`;
  if (hotels.length === 0) {
    html += `<p class="text-gray-400 text-sm py-4">No hotels found for ${currentDestination}. Try a different destination.</p>`;
  } else {
    hotels.forEach(h => {
      html += `
        <div class="bg-white rounded-xl border border-gray-200 p-4 mb-3 card-hover ${selectedItems.hotel?.id === h.id ? 'border-primary-400 ring-2 ring-primary-200' : ''}">
          <div class="flex justify-between items-start mb-2">
            <div>
              <p class="font-medium">${h.emoji} ${h.name}</p>
              <p class="text-sm text-gray-500">${h.city}, ${h.country}</p>
            </div>
            <div class="text-right">
              <span class="text-lg font-bold text-primary-600">$${h.price}</span>
              <p class="text-xs text-gray-400">/night</p>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1 text-yellow-500 text-sm">
              <span>★</span><span class="text-gray-700">${h.rating}</span>
            </div>
            <span class="text-sm text-gray-500">${currentNights} nights = $${h.price * currentNights}</span>
          </div>
        </div>`;
    });
  }
  html += `</div>`;
  
  // Activities
  html += `<div><h3 class="font-semibold text-gray-700 mb-3 flex items-center gap-2">🎯 Activities</h3>`;
  if (activities.length === 0) {
    html += `<p class="text-gray-400 text-sm py-4">No activities listed for ${currentDestination} yet.</p>`;
  } else {
    activities.forEach(a => {
      const free = a.price === 0;
      html += `
        <div class="bg-white rounded-xl border border-gray-200 p-4 mb-3 card-hover">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-medium">${a.emoji} ${a.name}</p>
              <p class="text-sm text-gray-500 capitalize">${a.category} · ${a.duration}</p>
            </div>
            <span class="font-bold ${free ? 'text-emerald-600' : 'text-primary-600'}">${free ? 'FREE' : '$' + a.price}</span>
          </div>
          <div class="flex items-center gap-1 text-yellow-500 text-sm mt-1">
            <span>★</span><span class="text-gray-700">${a.rating}</span>
          </div>
        </div>`;
    });
  }
  html += `</div></div>`;
  
  contentEl.innerHTML = html;
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>

<footer class="bg-gray-900 text-gray-400 py-8 px-4 text-center text-sm">
  <p>🌴 Holap — Plan smarter, spend less</p>
</footer>

</body>
</html>
